name: HERRAMIENTAS PARA EL DESARROLLO

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          echo "📁 Carpeta actual:"
          pwd
          echo "📁 Archivos en raíz del repositorio:"
          ls -la
          echo "📁 Archivos dentro de Integrador1:"
          ls -la Integrador1 || true
          echo "📁 Archivos dentro de Integrador1/herramientasdedesarrollo:"
          ls -la Integrador1/herramientasdedesarrollo || true

      # ========================================================
      # STEP 1: CONFIGURAR JAVA
      # ========================================================
      - name: Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ========================================================
      # STEP 2: EJECUTAR GRADLE
      # ========================================================
      - name: Compile, Test, and Package
        run: |
          cd Integrador1/herramientasdedesarrollo

          echo "👉 Contenido del proyecto:"
          ls -la

          echo "🔧 Dando permisos a gradlew"
          chmod +x gradlew

          echo "🏗️ Ejecutando build..."
          ./gradlew clean build

      # ========================================================
      # STEP 3: GENERAR PROVENANCE
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          cd Integrador1/herramientasdedesarrollo
          set -euo pipefail
          
          files=$(find build/libs/ -name "*.jar" -type f | xargs)
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
