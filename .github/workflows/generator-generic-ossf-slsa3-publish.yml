name: HERRAMIENTAS PARA EL DESARROLLO

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          echo "📁 Carpeta actual:"
          pwd
          echo "📁 Archivos en raíz del repositorio:"
          ls -la
          echo "📁 Archivos dentro de herramientasdesedesarrollo:"
          ls -la herramientasdesedesarrollo || true

      # ========================================================
      # Step 1: BUILD, TEST, AND GENERATE ARTIFACTS (CI Core)
      # ========================================================

      # 1. Configurar Entorno Java 21
      - name: Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 2. DAR PERMISOS Y EJECUTAR GRADLE WRAPPER
      - name: Compile, Test, and Package
        run: |
          cd herramientasdesedesarrollo

          echo "👉 Contenido de herramientasdesedesarrollo:"
          ls -la

          echo "🔧 Asignando permisos al gradlew (por si Git los quita)"
          chmod +x gradlew

          echo "🏗️ Ejecutando build..."
          ./gradlew clean build

      # ========================================================
      # Step 2: Generate provenance subjects
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          cd herramientasdesedesarrollo
          set -euo pipefail
          
          files=$(find build/libs/ -name "*.jar" -type f | xargs)
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true

