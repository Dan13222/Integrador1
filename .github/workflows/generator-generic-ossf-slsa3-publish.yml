name: HERRAMIENTAS PARA EL DESARROLLO

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    defaults:
      run:
        working-directory: herramientasdesedesarrollo   # 👈 SE AGREGA ESTO

    steps:
      - uses: actions/checkout@v4

      # ========================================================
      # Step 1: BUILD, TEST, AND GENERATE ARTIFACTS (CI Core)
      # ========================================================

      # 1. Configurar Entorno Java 21
      - name: Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 2. Compilar y Ejecutar Pruebas
      - name: Compile, Test, and Package
        run: ./gradlew clean build

      # ========================================================
      # Step 2: Generate provenance subjects
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          
          # List los artefactos .jar generados por Gradle
          files=$(find build/libs/ -name "*.jar" -type f | xargs)
          
          # Generar los sujetos (base64 encoded)
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
