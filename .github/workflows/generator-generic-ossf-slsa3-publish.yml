name: HERRAMIENTAS PARA EL DESARROLLO

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug directory structure
        run: |
          echo "📁 Carpeta actual:"
          pwd
          echo "📁 Archivos en la raíz del repositorio:"
          ls -la
          echo "📁 Archivos dentro de herramientasdedesarrollo:"
          ls -la herramientasdedesarrollo || true

      # ============================
      # Step 1: BUILD WITH GRADLE
      # ============================

      - name: Setup Java JDK (21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Compile, Test, and Package
        run: |
          cd herramientasdedesarrollo

          echo "👉 Contenido de la carpeta actual:"
          ls -la

          echo "🔧 Dando permisos al gradlew"
          chmod +x gradlew

          echo "🏗️ Ejecutando build..."
          ./gradlew clean build

      # =========================================
      # Step 2: Generate provenance subject hash
      # =========================================
      - name: Generate subject for provenance
        id: hash
        run: |
          cd herramientasdedesarrollo
          set -euo pipefail

          echo "📦 Buscando archivos .jar en build/libs/"
          files=$(find build/libs/ -name "*.jar" -type f | xargs)
          echo "🔐 Generando hash..."
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
